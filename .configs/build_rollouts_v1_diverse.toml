max_samples = 1
max_targets_per_sample = 2
require_label_valid = true
min_valid_root_candidates = 2
log_timing = true
verbosity = 1

[source]
split = "all"
limit = 1
return_format = "sample"
include_efm_snippet = true
include_gt_mesh = true
load_backbone = true
load_candidates = false
load_depths = false
load_candidate_pcs = false
load_gt_obbs = true
load_detected_obbs = true
load_trajectory_metadata = true
map_location = "cpu"
verbosity = 1

[source.store]
store_dir = "vin_offline"

[candidate_mixture.base]
camera_label = "rgb"
num_samples = 48
oversample_factor = 2.0
max_resamples = 2
align_to_gravity = true
min_radius = 0.25
max_radius = 1.1
min_elev_deg = -12.0
max_elev_deg = 18.0
delta_azimuth_deg = 110.0
sampling_strategy = "forward_powerspherical"
kappa = 8.0
min_distance_to_mesh = 0.2
ensure_collision_free = true
ensure_free_space = true
collision_backend = "pytorch3d"
ray_subsample = 32
step_clearance = 0.1
enforce_motion_realism = true
max_step_distance_m = 1.25
max_height_delta_m = 0.35
max_backward_step_m = 0.45
max_yaw_delta_deg = 90.0
device = "cpu"
verbosity = 1
collect_rule_masks = true
collect_debug_stats = true
view_max_angle_deg = 0.0
view_max_azimuth_deg = 0.0
view_max_elevation_deg = 0.0
view_roll_jitter_deg = 0.0
seed = 0

[[candidate_mixture.components]]
name = "radial_towards_target_bearing"
count = 16
view_mode = "radial_towards"
position_mode = "target_bearing_local"
min_radius = 0.35
max_radius = 1.1
view_max_azimuth_deg = 0.0
view_max_elevation_deg = 0.0

[[candidate_mixture.components]]
name = "radial_away_target_bearing"
count = 16
view_mode = "radial_away"
position_mode = "target_bearing_local"
min_radius = 0.35
max_radius = 1.1
view_max_azimuth_deg = 0.0
view_max_elevation_deg = 0.0

[[candidate_mixture.components]]
