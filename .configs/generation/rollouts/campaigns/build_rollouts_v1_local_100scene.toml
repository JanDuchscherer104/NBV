# Local-only, resumable V1 rollout campaign over all 100 GT-mesh ASE scenes.
#
# The campaign selects one deterministic root per scene with shard-level reserves.
# Every actor-visible detected target with oriented 3D IoU > 0.20 is admitted;
# omitted target caps mean all matched targets. Each completed source/profile
# shard is immutable and registered into the append-only rollout collection.
# Re-running the same command validates and skips completed work.
#
# Plan: aria_nbv/.venv/bin/nbv-plan-rollout-campaign --config-path <this-file>
# Run:  aria_nbv/.venv/bin/nbv-run-rollout-campaign  --config-path <this-file>
# Stop: Ctrl-C; resume with the same run command.
campaign_id = "v1-local-100scene-t1"
seed = 20260728
expected_scene_count = 100
ase_efm_dir = ".data/ase_efm"
ase_meshes_dir = ".data/ase_meshes"
output_root = ".data/offline_cache/rollout_campaign_v1_local_100scene"
evidence_dir = ".configs/evidence/rollouts/local_100scene"
collection_dir = ".data/offline_cache/rollout_collection_v1_local_100scene"
realistic_profile = "realistic_core_60"
challenger_profiles = [
    "rich_local_60",
    "radial_backtrack_60",
    "free_shell_upper_bound_60",
]
paired_panel_scene_count = 20

[source_writer]
include_backbone = true
include_depths = false
include_pointclouds = false
include_diagnostic_payloads = false
include_gt_obbs = true
include_detected_obbs = true
include_trajectory_metadata = true
vin_pad_points = 50000
semidense_max_points = 50000
semidense_include_obs_count = false
max_candidates = 1
samples_per_shard = 1
max_samples = 1
train_val_split = 0.0
overwrite = false
num_failures_allowed = 0
backbone_numeric_keep_fields = [
    "t_world_voxel",
    "voxel_extent",
    "occ_pr",
    "occ_input",
    "free_input",
    "counts",
    "cent_pr",
    "pts_world",
]
backbone_payload_keep_fields = [
    "t_world_voxel",
    "voxel_extent",
    "occ_pr",
    "cent_pr",
    "bbox_pr",
    "clas_pr",
    "cent_pr_nms",
    "obbs_pr_nms",
    "obb_pred",
    "obb_pred_viz",
    "obb_pred_sem_id_to_name",
    "obb_pred_probs_full",
    "obb_pred_probs_full_viz",
]

[source_writer.store]
store_dir = ".data/offline_cache/rollout_campaign_v1_local_100scene/source-placeholder"

[source_writer.dataset]
atek_variant = "efm"
scene_ids = []
snippet_ids = []
snippet_key_filter = []
batch_size = 1
wds_shuffle = false
wds_repeat = false
load_meshes = true
require_mesh = true
mesh_simplify_ratio = 1.0
crop_mesh = false
cache_meshes = true
device = "cpu"

[source_writer.labeler]
device = "cuda"
backprojection_stride = 16

[source_writer.labeler.generator]
device = "cuda"
camera_label = "rgb"
num_samples = 4
oversample_factor = 2.0
max_resamples = 2
align_to_gravity = true
min_radius = 0.5
max_radius = 1.8
min_elev_deg = -20.0
max_elev_deg = 25.0
delta_azimuth_deg = 170.0
sampling_strategy = "uniform_sphere"
min_distance_to_mesh = 0.2
ensure_collision_free = false
ensure_free_space = true
collision_backend = "pytorch3d"
view_direction_mode = "radial_away"
view_max_azimuth_deg = 60.0
view_max_elevation_deg = 30.0
view_roll_jitter_deg = 0.0
seed = 0

[source_writer.labeler.depth]
max_candidates_final = 1
resolution_scale = 0.05

[source_writer.labeler.depth.renderer]
device = "cuda"
znear = 0.001
zfar = 20.0
