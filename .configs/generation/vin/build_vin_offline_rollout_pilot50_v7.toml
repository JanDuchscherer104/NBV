# Strict-v7 profile-independent VIN source for paired rollout pilots.
#
# This source cache preserves full root VIN points, GT OBBs, trajectory metadata,
# and full-resolution GT meshes for live rollout reattachment. Its one stored
# one-step oracle candidate exists only to satisfy the strict-v7 cache schema;
# rollout campaigns regenerate their scientific 60-action candidate mixtures.
#
# Usage from the repository root:
#   aria_nbv/.venv/bin/nbv-build-offline \
#     --config-path .configs/generation/vin/build_vin_offline_rollout_pilot50_v7.toml

include_backbone = false
include_depths = false
include_pointclouds = false
include_diagnostic_payloads = false
include_gt_obbs = true
include_detected_obbs = false
include_trajectory_metadata = true
vin_pad_points = 50000
semidense_max_points = 50000
semidense_include_obs_count = false
max_candidates = 1
samples_per_shard = 10
max_samples = 50
train_val_split = 0.0
overwrite = false
num_failures_allowed = 0

[store]
store_dir = "vin_offline_rollout_pilot50_v7"

[dataset]
atek_variant = "efm"
scene_ids = ["81283", "81286", "82004", "83515", "83550"]
# Explicit shard paths avoid the repeated tar-header scan performed when sample
# keys are supplied through snippet_ids. Each listed shard contains eight rows.
snippet_ids = [
  ".data/ase_efm/81283/shards-0000.tar",
  ".data/ase_efm/81283/shards-0001.tar",
  ".data/ase_efm/81286/shards-0000.tar",
  ".data/ase_efm/81286/shards-0001.tar",
  ".data/ase_efm/82004/shards-0000.tar",
  ".data/ase_efm/82004/shards-0001.tar",
  ".data/ase_efm/83515/shards-0000.tar",
  ".data/ase_efm/83515/shards-0001.tar",
  ".data/ase_efm/83550/shards-0000.tar",
  ".data/ase_efm/83550/shards-0001.tar",
]
snippet_key_filter = [
  "AriaSyntheticEnvironment_81283_AtekDataSample_000000",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000001",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000002",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000003",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000004",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000005",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000006",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000007",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000008",
  "AriaSyntheticEnvironment_81283_AtekDataSample_000009",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000000",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000001",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000002",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000003",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000004",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000005",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000006",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000007",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000008",
  "AriaSyntheticEnvironment_81286_AtekDataSample_000009",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000000",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000001",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000002",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000003",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000004",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000005",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000006",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000007",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000008",
  "AriaSyntheticEnvironment_82004_AtekDataSample_000009",
  "AriaSyntheticEnvironment_83515_AtekDataSample_000000",
  "AriaSyntheticEnvironment_83515_AtekDataSample_000001",
  "AriaSyntheticEnvironment_83515_AtekDataSample_000002",
