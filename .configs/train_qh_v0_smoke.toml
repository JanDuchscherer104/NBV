seed = 7
output_dir = ".logs/qh/smoke"

[trainer]
is_debug = true
use_distributed_sampler = false
use_wandb = false
enable_validation = false

[data]
batch_size = 2
num_workers = 0
seed = 7

[data.train.rollout]
store_dirs = ["/ABS/PATH/TO/ARIA_DSS/caches/oracle/rollouts-v0-smoke.zarr"]

[data.train.actor]
split = "train"

[data.train.actor.store]
store_dir = "/ABS/PATH/TO/ARIA_DSS/caches/vin/vin-offline-v7"

[module]
huber_delta = 1.0
target_sync_interval = 100

[module.scorer]
horizon = 2
candidate_token_dim = 128
num_heads = 4
feedforward_multiplier = 2
dropout = 0.0

[module.optimizer]
learning_rate = 0.0001
weight_decay = 0.001
