# Five-scene training pilot for the myopic CUDA campaign.  This has a distinct
# identity and destination so it cannot resume or overwrite broad-campaign
# artifacts.
campaign_id = "cuda-rollouts-v1-pilot"
mode = "pilot"
frozen_profile = "realistic_core_60"
pilot_scene_count = 5
temperatures = [0.5, 1.0, 2.0, 4.0]
writer_config_path = ".configs/build_rollouts_v1_cuda_campaign_writer.toml"
output_root = ".campaign/cuda-rollouts-v1-pilot"
