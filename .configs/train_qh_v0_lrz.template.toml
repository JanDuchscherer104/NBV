seed = 17
output_dir = "/ABS/PATH/TO/ARIA_DSS/checkpoints/qh/RUN_ID"

[trainer]
accelerator = "gpu"
devices = 2
strategy = "ddp"
max_epochs = 50
precision = "bf16-mixed"
use_distributed_sampler = false
use_wandb = false
enable_validation = false
log_every_n_steps = 10

[trainer.callbacks]
use_model_checkpoint = true
checkpoint_dir = "/ABS/PATH/TO/ARIA_DSS/checkpoints/qh/RUN_ID"
checkpoint_filename = "epoch={epoch}-step={step}-train-loss={train/loss:.4f}"
checkpoint_save_top_k = 2
checkpoint_save_last = true
checkpoint_every_n_train_steps = 1000
use_lr_monitor = false
use_rich_model_summary = false

[data]
batch_size = 4
num_workers = 8
pin_memory = true
persistent_workers = true
seed = 17

[data.train.rollout]
store_dirs = ["/ABS/PATH/TO/ARIA_DSS/caches/oracle/rollouts-v0-train.zarr"]

[data.train.actor]
split = "train"

[data.train.actor.store]
store_dir = "/ABS/PATH/TO/ARIA_DSS/caches/vin/vin-offline-v7"

[module]
huber_delta = 1.0
target_sync_interval = 1000

[module.scorer]
horizon = 2
candidate_token_dim = 128
num_heads = 4
feedforward_multiplier = 2
dropout = 0.0

[module.optimizer]
learning_rate = 0.0001
weight_decay = 0.001
