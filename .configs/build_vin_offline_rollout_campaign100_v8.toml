# Strict-v7 profile-independent VIN source for the reviewed 100-row campaign.
#
# This source cache preserves full root VIN points, GT OBBs, trajectory metadata,
# and full-resolution GT meshes for live rollout reattachment. Its one stored
# one-step oracle candidate exists only to satisfy the strict-v7 cache schema;
# rollout campaigns regenerate their scientific 60-action candidate mixtures.
#
# Usage from the repository root:
#   uv run nbv-build-offline \
#     --config-path .configs/build_vin_offline_rollout_campaign100_v8.toml

include_backbone = true
include_depths = false
include_pointclouds = false
include_diagnostic_payloads = false
include_gt_obbs = true
include_detected_obbs = true
include_trajectory_metadata = true
vin_pad_points = 50000
semidense_max_points = 50000
semidense_include_obs_count = false
max_candidates = 1
samples_per_shard = 10
max_samples = 100
train_val_split = 0.0
overwrite = false
num_failures_allowed = 0

[store]
store_dir = "vin_offline_rollout_campaign100_v8"

[dataset]
atek_variant = "efm"
scene_ids = [
  "889", "8517", "8559", "8671", "8694", "8715", "8777", "8822", "8857", "8860",
  "8938", "81022", "81048", "81056", "81128", "81161", "81180", "81181", "81184", "81188",
  "81226", "81272", "81283", "81286", "81366", "81387", "81426", "81477", "81483", "81625",
  "81693", "81772", "81807", "81964", "82004", "82254", "82257", "82258", "82271", "82294",
  "82309", "82311", "82342", "82448", "82517", "82545", "82555", "82620", "82630", "82647",
  "82658", "82700", "82832", "82889", "82902", "82953", "83036", "83078", "83086", "83098",
  "83121", "83269", "83307", "83317", "83379", "83393", "83397", "83400", "83448", "83467",
  "83506", "83515", "83522", "83550", "83560", "83577", "83598", "83678", "83692", "83713",
  "83730", "83746", "83780", "83803", "83833", "83836", "83998", "84001", "84003", "84009",
  "84052", "84074", "84080", "84171", "84185", "84186", "84230", "84271", "84309", "84320",
]
batch_size = 1
wds_shuffle = false
wds_repeat = false
load_meshes = true
require_mesh = true
mesh_simplify_ratio = 1.0
crop_mesh = false
device = "cpu"

[labeler]
device = "cuda"
backprojection_stride = 16

    [labeler.generator]
    device = "cuda"
    camera_label = "rgb"
    num_samples = 4
    oversample_factor = 2.0
    max_resamples = 2
    align_to_gravity = true
    min_radius = 0.5
    max_radius = 1.8
    min_elev_deg = -20.0
    max_elev_deg = 25.0
    delta_azimuth_deg = 170.0
    sampling_strategy = "uniform_sphere"
    min_distance_to_mesh = 0.2
    ensure_collision_free = false
    ensure_free_space = true
    collision_backend = "pytorch3d"
    view_direction_mode = "radial_away"
    view_max_azimuth_deg = 60.0
    view_max_elevation_deg = 30.0
    view_roll_jitter_deg = 0.0
    seed = 0

    [labeler.depth]
    max_candidates_final = 1
    resolution_scale = 0.05

        [labeler.depth.renderer]
        device = "cuda"
        znear = 0.001
        zfar = 20.0
        cull_backfaces = true
        blur_radius = 0.0
        bin_size = 0
        dtype = "float32"

    [labeler.oracle]
    fusion_voxel_size_m = 0.05
    fusion_max_points = 1024
