# Portable ARIA-NBV Codex configuration example.
#
# Copy this file to the ignored `.codex/config.toml` only for operator-local
# settings. Trust configuration belongs in the user's Codex config, not here.
#
# Matt skills are globally installed from the pinned checkout by:
#   python3 scripts/scaffold/bootstrap_matt_skills.py
# The bootstrap renders a managed `[[skills.config]]` block with absolute local
# paths: exactly 12 pinned Matt skills enabled and every other skill from that
# checkout disabled. Generate or refresh only that block with:
#   python3 scripts/scaffold/matt_skills_policy.py render-config \
#     --source-checkout /path/to/pinned/mattpocock-skills \
#     --skills-root /absolute/path/to/.agents/skills
# Remove project activation without deleting global skills with:
#   python3 scripts/scaffold/matt_skills_policy.py rollback
#
# Do not hand-write a partial Matt list, use `latest`, commit absolute paths, or
# run the upstream `setup-matt-pocock-skills` skill in this repository.
