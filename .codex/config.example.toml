# Optional local Codex/OMX template for ARIA-NBV.
#
# Copy this to .codex/config.toml only in your local checkout. Do not commit the
# runtime copy. Run `omx setup` after installing oh-my-codex if you want OMX to
# manage additional local runtime settings.

[projects."/absolute/path/to/ARIA-NBV"]
trust_level = "trusted"

# Repository skills are discovered directly from .agents/skills and are not
# namespaced by an unrelated plugin. Optional MemPalace MCP access lives in the
# repo marketplace at .agents/plugins/marketplace.json; it requires the global
# `mempalace-mcp` executable and does not own skills or hooks.
#
# Matt Pocock skills are installed outside this repo, for example:
#   npx skills@latest add mattpocock/skills
# Keep the canonical ARIA-NBV activation policy in
# .agents/references/mattpocock_skills_manifest.toml. If a local runtime
# supports project-specific skill enablement, mirror only that tracked allowlist
# in the untracked .codex/config.toml.
