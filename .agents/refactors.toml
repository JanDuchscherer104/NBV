[[refactor]]
id = "refactor-021"
title = "Streamline rollout Zarr chunking and manifest payload"
description = "Reduce rollout-store file-count and metadata bloat before schema-1.0 scale generation."
priority = "high"
status = "todo"
labels = ["rollouts", "zarr", "storage", "simplification", "performance"]
issue_ids = ["issue-032", "issue-018", "issue-022"]
loc_min = 80
loc_expected = 240
loc_max = 620
context = ["The 2026-05-20 schema-1.0 structural probe produced a 13 MB store for only 600 candidates; candidates/ alone was 10 MB.", "candidates/pose_world_cam and candidates/pose_relative_root each used 600 chunk files and 4.8 MB for roughly 29 KB of raw float payload because _default_chunks chunks 2D arrays as one row per chunk.", "target_eval_crops/ still occupied 120 KB even when target_eval_crops_enabled=false and zero crop rows were stored.", "The manifest embeds repeated resolved PathConfig trees in the writer config; this is useful for audits but noisy and should not be repeated unnecessarily across scale shards when hashes and campaign-level config can own most details."]
references = ["repo:.agents/work/rollout-scale-readiness/04-zarr-chunking-manifest-plan.md", "repo:aria_nbv/aria_nbv/rollouts/zarr_store.py", "repo:aria_nbv/aria_nbv/rollouts/dataset_writer.py", "repo:aria_nbv/tests/rollouts/test_zarr_store.py"]
implementation_notes = ["Change default rollout table chunking for 2D factual arrays from (1, width) to row blocks sized by configurable approximate byte budget plus row-count floor/ceiling.", "Use first targets of 1-8 MB uncompressed chunks for factual candidate/source/target/step arrays where practical and 16k-64k row caps depending on field width.", "Keep q_h chunks state-row oriented, for example 64 or 128 states per chunk, because Q_H loaders read state-action blocks.", "Keep q_h and selected_depth custom chunking separate because their access patterns differ.", "For zero-row optional groups, omit payload arrays when disabled if readers can distinguish disabled from corrupt; otherwise keep only marker attrs or compact zero-length arrays.", "Consider manifest compaction for shard stores: keep hashes, effective config summary, and invocation metadata in every shard; move full resolved config trees to a campaign/root manifest when available.", "Measure file count, du size, and read speed before/after on a small schema-1.0 rollout probe."]
acceptance = ["A 600-candidate schema-1.0 probe no longer creates one chunk file per candidate for pose arrays.", "Candidate factual arrays use chunking appropriate for minibatch and scan reads, with chunk policy recorded or inferable.", "Optional zero-row audit groups are omitted or reduced to negligible marker footprint and still validate.", "Manifest payload remains auditable without duplicating large resolved path/config trees unnecessarily in every scale shard."]
verification = ["cd aria_nbv && uv run pytest tests/rollouts/test_zarr_store.py tests/rollouts/test_dataset_writer.py -q", "du -sh <fresh_schema_1_store>.zarr <fresh_schema_1_store>.zarr/candidates/* | sort -h", "find <fresh_schema_1_store>.zarr/candidates/pose_world_cam -type f | wc -l"]

