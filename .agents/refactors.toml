context = ["CounterfactualTargetOracleRriScorer already crops target mesh/current points/candidate points with the matched GT ObbTW, but OracleRRI.score still requires extend=Tensor[6] and therefore forces a derived target AABB adapter after the oriented crop.", "target_gt_aabb_world is useful as a debug/legacy envelope, but it should not look like the thesis-core target crop contract because AABBs include extra volume for rotated targets.", "The clean target-RRI contract is ObbTW or pre-cropped target mesh for target labels, while scene-level diagnostic RRI can keep the snippet/occupancy AABB path."]
implementation_notes = ["Add a narrow OracleRRI.score_cropped or equivalent internal path that accepts already-cropped gt_verts/gt_faces and skips _crop_mesh_to_aabb.", "Route CounterfactualTargetOracleRriScorer target scoring through the pre-cropped path after its ObbTW any-vertex crop.", "Keep scene_rri on the existing AABB extent path unless a broader crop-policy API is introduced.", "Audit target_gt_aabb_world consumers and either demote it to debug/visualization use or remove it from the public data_handling export once no active training path depends on it.", "Document the target crop policy as GT ObbTW oriented any-vertex v1 and keep empty crops as target-invalid rather than low RRI."]
