# ARIA-NBV policy for mattpocock/skills.
#
# This manifest is the tracked repo policy. The exact reviewed upstream snapshot
# is vendored under .agents/skills; update it only as one audited, SHA-pinned
# payload. ARIA source owners and activation policy remain authoritative.

[source]
repo = "mattpocock/skills"
url = "https://github.com/mattpocock/skills.git"
reviewed_ref = "66898f60e8c744e269f8ce06c2b2b99ce7660d5f"
skills_tree = "57f1af755b8e6e73145f3a6de62d0ddffac6e415"
reviewed_at = "2026-07-14"
upstream_version = "1.1.0"
license = "MIT"
vendored_path = ".agents/skills"
license_path = ".agents/licenses/mattpocock-skills-LICENSE"
vendor_policy = "exact_pinned_snapshot"
sync_command = "make claude-skills"
default_policy = "disabled_unless_selected"
contract = ".agents/references/mattpocock_skills_contract.md"
runtime_note = ".codex/config.toml is untracked operator-local state; mirror this manifest there only when the local runtime supports project-specific skill enablement."

[postures]
model = ["codebase-design", "tdd"]
explicit = ["improve-codebase-architecture", "writing-great-skills", "handoff", "teach"]
reference = [
  "ask-matt",
  "code-review",
  "diagnosing-bugs",
  "domain-modeling",
  "grill-me",
  "grill-with-docs",
  "grilling",
  "implement",
  "prototype",
  "research",
  "resolving-merge-conflicts",
  "setup-matt-pocock-skills",
  "to-tickets",
  "to-spec",
  "triage",
  "writing-beats",
  "writing-fragments",
  "writing-shape",
]
skip = [
  "claude-handoff",
  "design-an-interface",
  "edit-article",
  "git-guardrails-claude-code",
  "loop-me",
  "migrate-to-shoehorn",
  "obsidian-vault",
  "qa",
  "request-refactor-plan",
  "scaffold-exercises",
  "setup-ts-deep-modules",
  "setup-pre-commit",
  "ubiquitous-language",
  "wayfinder",
  "wizard",
]

