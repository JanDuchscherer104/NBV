# ARIA-NBV policy for mattpocock/skills.
#
# This manifest is the tracked repo policy. Runtime installation still happens
# outside the repo with the upstream installer; do not vendor the upstream skill
# tree under .agents/skills.

[source]
repo = "mattpocock/skills"
url = "https://github.com/mattpocock/skills.git"
reviewed_ref = "896f14d9c25659f03b24e08e4efc3ee69bbade08"
reviewed_at = "2026-07-08"
license = "MIT"
install_command = "npx skills@latest add mattpocock/skills"
default_policy = "disabled_unless_selected"
runtime_note = ".codex/config.toml is untracked operator-local state; mirror this manifest there only when the local runtime supports project-specific skill enablement."

[postures]
model = ["tdd"]
explicit = ["codebase-design", "improve-codebase-architecture", "domain-modeling", "writing-great-skills", "handoff", "teach"]
reference = [
  "ask-matt",
  "code-review",
  "diagnosing-bugs",
  "grill-me",
  "grill-with-docs",
  "grilling",
  "implement",
  "prototype",
  "research",
  "resolving-merge-conflicts",
  "setup-matt-pocock-skills",
  "to-issues",
  "to-prd",
  "triage",
  "writing-beats",
  "writing-fragments",
  "writing-shape",
]
skip = [
  "edit-article",
  "loop-me",
  "migrate-to-shoehorn",
  "obsidian-vault",
  "qa",
  "request-refactor-plan",
  "scaffold-exercises",
  "setup-pre-commit",
  "ubiquitous-language",
  "wayfinder",
  "wizard",
]

[[skill]]
name = "ask-matt"
bucket = "engineering"
upstream_path = "skills/engineering/ask-matt/SKILL.md"
posture = "reference"
aria_owner = "agent-behavior"
reason = "Upstream router only; ARIA root routing and OMX own workflow selection."

[[skill]]
name = "code-review"
bucket = "engineering"
upstream_path = "skills/engineering/code-review/SKILL.md"
posture = "reference"
aria_owner = "code-review-aria-nbv"
reason = "Borrow Standards/Spec vocabulary; ARIA owns severity, domain invariants, PR/worktree review, and verification."

