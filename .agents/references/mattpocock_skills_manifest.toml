# ARIA-NBV policy for mattpocock/skills.
#
# This manifest is the tracked repo policy. Runtime installation still happens
# outside the repo with the upstream installer; do not vendor the upstream skill
# tree under .agents/skills.

[source]
repo = "mattpocock/skills"
url = "https://github.com/mattpocock/skills.git"
reviewed_ref = "8b78b531ab965735c5dc74f6f7a219e1e37326df"
reviewed_at = "2026-08-14"
license = "MIT"
install_command = "npx skills@latest add mattpocock/skills --global --agent codex"
default_policy = "disabled_unless_selected"
runtime_note = ".codex/config.toml is untracked operator-local state; mirror this manifest there only when the local runtime supports project-specific skill enablement."

[postures]
model = ["tdd"]
explicit = ["codebase-design", "improve-codebase-architecture", "domain-modeling", "handoff", "teach"]
reference = [
  "ask-matt",
  "code-review",
  "diagnosing-bugs",
  "grill-me",
  "grill-with-docs",
  "grilling",
  "implement",
  "prototype",
  "research",
  "resolving-merge-conflicts",
  "setup-matt-pocock-skills",
  "to-questionnaire",
  "to-spec",
  "to-tickets",
  "triage",
  "writing-beats",
  "writing-for-agents",
  "writing-fragments",
  "writing-shape",
]
skip = [
  "claude-handoff",
  "git-guardrails-claude-code",
  "loop-me",
  "migrate-to-shoehorn",
  "scaffold-exercises",
  "setup-pre-commit",
  "setup-ts-deep-modules",
  "wait-what",
  "wayfinder",
  "wizard",
]

[[skill]]
name = "ask-matt"
bucket = "engineering"
upstream_path = "skills/engineering/ask-matt/SKILL.md"
posture = "reference"
aria_owner = "agent-behavior"
reason = "Upstream router only; ARIA root routing and OMX own workflow selection."

