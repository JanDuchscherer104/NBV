equations:
  rri.cd:
    tex: 'D(\mathcal{P},\mathcal{M}^{\mathrm{GT}})=D_{P\to M}(\mathcal{P},\mathcal{M}^{\mathrm{GT}})+D_{M\to P}(\mathcal{P},\mathcal{M}^{\mathrm{GT}})'
    typst: '#eqs.rri.cd'
  rri.acc:
    tex: 'D_{P\to M}(\mathcal{P},\mathcal{M}^{\mathrm{GT}})=\frac{1}{\lVert\mathcal{P}\rVert}\sum_{\boldsymbol{p}\in\mathcal{P}}\min_{\boldsymbol{f}\in\mathcal{F}^{\mathrm{GT}}} d(\boldsymbol{p},\boldsymbol{f})^2'
    typst: '#eqs.rri.acc'
  rri.comp:
    tex: 'D_{M\to P}(\mathcal{P},\mathcal{M}^{\mathrm{GT}})=\frac{1}{\lVert\mathcal{F}^{\mathrm{GT}}\rVert}\sum_{\boldsymbol{f}\in\mathcal{F}^{\mathrm{GT}}}\min_{\boldsymbol{p}\in\mathcal{P}} d(\boldsymbol{p},\boldsymbol{f})^2'
    typst: '#eqs.rri.comp'
  rri.point_sampled_chamfer:
    tex: 'D_{\mathrm{PS-Chamfer}}(\mathcal{P},\mathcal{Q})=\frac{1}{|\mathcal{P}|}\sum_{\boldsymbol{p}\in\mathcal{P}}\min_{\boldsymbol{q}\in\mathcal{Q}}\lVert\boldsymbol{p}-\boldsymbol{q}\rVert_2^2+\frac{1}{|\mathcal{Q}|}\sum_{\boldsymbol{q}\in\mathcal{Q}}\min_{\boldsymbol{p}\in\mathcal{P}}\lVert\boldsymbol{q}-\boldsymbol{p}\rVert_2^2'
    typst: '#eqs.rri.point_sampled_chamfer'
  rri.union:
    tex: '\mathcal{P}_{t\cup q}=\mathcal{P}_t\cup\mathcal{P}_q'
    typst: '#eqs.rri.union'
  rri.rri:
    tex: '\mathrm{RRI}(q)=\frac{D(\mathcal{P}_t,\mathcal{M}^{\mathrm{GT}})-D(\mathcal{P}_t\cup\mathcal{P}_q,\mathcal{M}^{\mathrm{GT}})}{D(\mathcal{P}_t,\mathcal{M}^{\mathrm{GT}})+\varepsilon}'
    typst: '#eqs.rri.rri'
  rri.target_rri:
    tex: '\mathrm{RRI}_e(q)=\frac{D(\mathcal{P}_t^e,\mathcal{M}_e^{\mathrm{GT}})-D(\mathcal{P}_t^e\cup\mathcal{P}_q^e,\mathcal{M}_e^{\mathrm{GT}})}{D(\mathcal{P}_t^e,\mathcal{M}_e^{\mathrm{GT}})+\varepsilon}'
    typst: '#eqs.rri.target_rri'
  rri.greedy:
    tex: 'q^*=\operatorname*{argmax}_{q\in\mathcal{Q}}\mathrm{RRI}(q)'
    typst: '#eqs.rri.greedy'
  binning.edges:
    tex: 'e_k=\operatorname{Quantile}(\{r_i\}_{i=1}^{N}, k/K),\quad k\in\{1,\ldots,K-1\}'
    typst: '#eqs.binning.edges'
  binning.label:
    tex: 'y(r)=\sum_{k=1}^{K-1}\mathbb{1}[r>e_k],\quad y(r)\in\{0,\ldots,K-1\}'
    typst: '#eqs.binning.label'
  binning.levels:
    tex: 't_k=\mathbb{1}[y>k],\quad k\in\{0,\ldots,K-2\}'
    typst: '#eqs.binning.levels'
  coral.loss:
    tex: '\mathcal{L}_{\mathrm{coral}}(y,\boldsymbol{p})=-\sum_{k=0}^{K-2}\left(t_k\log p_k+(1-t_k)\log(1-p_k)\right)'
    typst: '#eqs.coral.loss'
  coral.rel_random:
    tex: '\mathcal{L}_{\mathrm{rel}}=\mathcal{L}_{\mathrm{coral}}/((K-1)\log 2)'
    typst: '#eqs.coral.rel_random'
  vin.loss_total:
    tex: '\mathcal{L}=\mathcal{L}_{\mathrm{coral}}+\lambda\mathcal{L}_{\mathrm{reg}}'
    typst: '#eqs.vin.loss_total'
  vin.aux_reg_mse:
    tex: '\mathcal{L}_{\mathrm{reg}}=\frac{1}{N}\sum_i(\hat{r}_i-r_i)^2'
    typst: '#eqs.vin.aux_reg_mse'
  metrics.spearman:
    tex: '\rho=\operatorname{corr}(\operatorname{rank}(\hat{r}_i),\operatorname{rank}(r_i))'
    typst: '#eqs.metrics.spearman'
  metrics.pearson:
    tex: 'r_{x,y}=\frac{\sum_i(x_i-\bar{x})(y_i-\bar{y})}{\sqrt{\sum_i(x_i-\bar{x})^2\sum_i(y_i-\bar{y})^2}}'
    typst: '#eqs.metrics.pearson'
  metrics.categorical_entropy:
    tex: 'H(\boldsymbol{p})=-\sum_{i:m_i=1}p_i\log p_i'
    typst: '#eqs.metrics.categorical_entropy'
  metrics.selection_rate_given_available:
    tex: '\mathrm{SelRate}_f=N_{\mathrm{selected},f}/N_{\mathrm{actor-valid},f}'
    typst: '#eqs.metrics.selection_rate_given_available'
  metrics.q_train_mask:
    tex: 'm_{t,i}^{\mathrm{train}}=m_{t,i}^{\mathrm{actor}}m_{t,i}^{\mathrm{oracle}}'
    typst: '#eqs.metrics.q_train_mask'
  metrics.selected_oracle_regret:
    tex: '\mathrm{Regret}_t=\max_{i:m_{t,i}=1}g_{t,i}-g_{t,a_t}'
    typst: '#eqs.metrics.selected_oracle_regret'
  metrics.topk_acc:
    tex: '\mathrm{TopKAcc}(k)=\frac{1}{N}\sum_i\mathbb{1}[y_i\in\mathrm{TopK}(\boldsymbol{\pi}_i,k)]'
    typst: '#eqs.metrics.topk_acc'
  metrics.candidate_validity:
    tex: 'm_i=\mathbb{1}[\mathrm{finite}]\mathbb{1}[v_i>0]\mathbb{1}[v_i^{\mathrm{sem}}>0]'
    typst: '#eqs.metrics.candidate_validity'
  rl.mdp:
    tex: '\mathcal{M}=(\mathcal{S},\mathcal{A},P,r,\gamma)'
    typst: '#eqs.rl.mdp'
  rl.nbv_mdp:
    tex: '\mathcal{M}_{\mathrm{NBV}}=(\mathcal{S},\mathcal{A},T,r_e,\gamma,H)'
    typst: '#eqs.rl.nbv_mdp'
  rl.nbv_process_tuple:
    tex: '\mathcal{M}_{\mathrm{NBV}}=(\mathcal{S}^{\mathrm{hist}},\mathcal{S}^{\mathrm{cf0}},\mathcal{S}^{\mathrm{oracle}},\{\mathcal{A}_t\},T,r_t^e,\gamma,H)'
    typst: '#eqs.rl.nbv_process_tuple'
  rl.evidence_chain:
    tex: '\mathcal{U}_{\mathrm{cov/unc}}\to\hat r_t^e(i)\to r_t^e\to G_t^{(H)}\to Q_{H,\theta}'
    typst: '#eqs.rl.evidence_chain'
  rl.candidate_row_equivariance:
    tex: 'f_\theta(\Pi X_t,\Pi m_t)=\Pi f_\theta(X_t,m_t)'
    typst: '#eqs.rl.candidate_row_equivariance'
  rl.masked_candidate_selection:
    tex: '\mathcal{A}_t=\{i:m_{t,i}=1\},\quad a_t^\theta=\operatorname*{argmax}_{i\in\mathcal{A}_t} f_{\theta,i}(X_t,m_t)'
    typst: '#eqs.rl.masked_candidate_selection'
  rl.s_hist:
    tex: 's_t^{\mathrm{hist}}=(I_{1:t},T_{1:t},P_{1:t}^{\mathrm{semi}},V^{\mathrm{root}},e_t,b_t)'
    typst: '#eqs.rl.s_hist'
  rl.s_off:
    tex: 's_t^{\mathrm{off}}=(\mathrm{VinSnippetView},\mathcal{Q}_t,N_t,m_{t,i},\ell_{t,i})'
    typst: '#eqs.rl.s_off'
  rl.s_cf0:
    tex: 's_t^{\mathrm{cf0}}=(V^{\mathrm{root}},\mathcal{P}_t,\mathcal{Q}_t,m_{t,i},\rho_{t,i},e_t,b_t)'
    typst: '#eqs.rl.s_cf0'
  rl.s_cf_geom:
    tex: 's_t^{\mathrm{cf+}}=(s_t^{\mathrm{cf0}},D_{1:t}^{\mathrm{sel}},P_{1:t}^{\mathrm{sel}},N_{1:t}^{\mathrm{sel}})'
    typst: '#eqs.rl.s_cf_geom'
  rl.s_oracle:
    tex: 's_t^{\mathrm{oracle}}=(s_t^{\mathrm{cf+}},\mathcal{M}^{\mathrm{GT}},\mathcal{M}_e^{\mathrm{GT}},\{D_{t,i}^{\mathrm{GT}},\mathcal{P}_{t,i}^{\mathrm{GT}},\mathrm{RRI}_{t,i}\}_{i=1}^{N_t})'
    typst: '#eqs.rl.s_oracle'
  rl.finite_action_set:
    tex: '\mathcal{Q}_t=\{q_{t,i}\}_{i=1}^{N_t},\quad \mathcal{A}(s_t)=\{i\in\{1,\ldots,N_t\}:m_{t,i}=1\},\quad q_t=q_{t,a_t}'
    typst: '#eqs.rl.finite_action_set'
  rl.counterfactual_transition:
    tex: '\mathcal{P}_{t+1}=\mathcal{P}_t\cup\mathcal{P}_{q_t}'
    typst: '#eqs.rl.counterfactual_transition'
  rl.target_rri_reward:
    tex: 'r_t^e=(\Delta_t^e-\Delta_{t+1}^e)/(\Delta_0^e+\varepsilon)'
    typst: '#eqs.rl.target_rri_reward'
  rl.observed_cumulative_root_gain:
    tex: 'G_{0:s,\mathrm{root}}^e=\sum_{k=0}^{s-1}r_{k,\mathrm{root}}^e'
    typst: '#eqs.rl.observed_cumulative_root_gain'
  rl.finite_horizon_return:
    tex: 'G_t^{(H)}=\sum_{k=0}^{H-1}\gamma^k r_{t+k}^e'
    typst: '#eqs.rl.finite_horizon_return'
  rl.q_h:
    tex: 'Q_H(s_t^{\mathrm{cf0}},a_t)=\mathbb{E}\left[G_t^{(H)}\mid s_t=s_t^{\mathrm{cf0}},a_t\right]'
    typst: '#eqs.rl.q_h'
  rl.reward_geom:
    tex: 'r_t^{\mathrm{geom}}=\log(D(\mathcal{P}_t,\mathcal{M}^{\mathrm{GT}})+\varepsilon)-\log(D(\mathcal{P}_{t+1},\mathcal{M}^{\mathrm{GT}})+\varepsilon)-\alpha\mathbb{1}[\mathrm{collision}(a_t)]-\beta c(a_t)'
    typst: '#eqs.rl.reward_geom'
  rl.q_backup:
    tex: 'y_t^Q=r_t+\gamma V(s_{t+1})'
    typst: '#eqs.rl.q_backup'
  action.space:
    tex: '\mathcal{A}^{\mathrm{cont}}\subset\mathbb{R}^3\times \operatorname{SO}(2)'
    typst: '#eqs.action.space'
  action.candidate_shell:
    tex: '\mathcal{Q}_t=\{q_{t,i}\}_{i=1}^{N_q},\quad N_q=60'
    typst: '#eqs.action.candidate_shell'
  action.robust_temperature_softmax:
    tex: '\ell_i=(s_i-\operatorname{median}(s))/(\operatorname{IQR}(s)\tau),\quad P(i\mid m_i=1)=\exp(\ell_i)/\sum_{j:m_j=1}\exp(\ell_j)'
    typst: '#eqs.action.robust_temperature_softmax'
  entity.target_descriptor:
    tex: '\boldsymbol{\phi}_e=\operatorname{Enc}_{\mathrm{tgt}}(\hat{\boldsymbol{B}}_e,\hat{\boldsymbol{y}}_e,\hat{\pi}_e,A_e^{\mathrm{proj}},n_e^{\mathrm{semi}},n_e^{\mathrm{EVL}},\omega_e^{\mathrm{EVL}},\ell_e^{\mathrm{src}},\boldsymbol{T}_{r_t,e},\boldsymbol{T}_{c_t,e})'
    typst: '#eqs.entity.target_descriptor'
  entity.target_identity_iou:
    tex: '\mu_{\mathrm{IoU}}(\hat e,e)=\operatorname{IoU}_{3D}(\hat{\boldsymbol{B}}_{\hat e},\boldsymbol{B}_e)'
    typst: '#eqs.entity.target_identity_iou'
    description: Same-class oriented 3D IoU used by the V1 observed-target matcher.
    thesis_list: true
    order: 207
  entity.target_identity_threshold:
    tex: '\tau_{\mathrm{IoU}}=0.20'
    typst: '#eqs.entity.target_identity_threshold'
    description: Strict V1 observed-target IoU threshold; equality is rejected.
    thesis_list: true
    order: 208
  entity.target_identity_qualified_count:
    tex: 'n_{\mathrm{qual}}(\hat e)=\left|\{e:\operatorname{class}(e)=\operatorname{class}(\hat e),\ \mu_{\mathrm{IoU}}(\hat e,e)>\tau_{\mathrm{IoU}}\}\right|'
    typst: '#eqs.entity.target_identity_qualified_count'
    description: Number of same-class GT OBBs whose oriented IoU is strictly above the V1 threshold.
    thesis_list: true
    order: 209
  entity.target_identity_acceptance:
    tex: 'a_{\mathrm{id}}(\hat e)=1\ \Longleftrightarrow\ n_{\mathrm{qual}}(\hat e)=1'
    typst: '#eqs.entity.target_identity_acceptance'
    description: V1 target admission requires exactly one qualifying GT OBB; zero or multiple qualifiers are rejected.
    thesis_list: true
    order: 210
  features.point_dino_token:
    tex: '\boldsymbol{x}_j^{\mathrm{pt}}=\operatorname{concat}(\boldsymbol{p}_j,\boldsymbol{f}_j^{\mathrm{DINO-comp}},\sigma_j^{-1},n_j,\boldsymbol{a}_j^{\mathrm{hist}})'
    typst: '#eqs.features.point_dino_token'
  scene.evl_local_support_read:
    tex: '\omega_{t,i}^{\mathrm{EVL}}=\frac{1}{K}\sum_{k=1}^{K}\mathbb{1}[x_{t,i,k}\in\mathcal{V}_0^{\mathrm{EVL}}]'
    typst: '#eqs.scene.evl_local_support_read'
  scene.ray_memory_update:
    tex: '\boldsymbol{M}_{t+1}^{\mathrm{ray}}=\operatorname{Fuse}(\boldsymbol{M}_t^{\mathrm{ray}},\mathcal{P}_{t,i}^{\mathrm{cand}},\mathcal{R}_{t,i}^{\mathrm{sel}})'
    typst: '#eqs.scene.ray_memory_update'
  scene.qh_scene_memory:
    tex: '\boldsymbol{\Phi}_t^{\mathrm{scene}}=(\boldsymbol{M}_t^{\mathrm{ray}},\boldsymbol{X}_t^{\mathrm{pt}},\boldsymbol{F}_t^{\mathrm{DINO@pt}},\boldsymbol{E}_0^{\mathrm{EVL-local}},\boldsymbol{O}_t^{\mathrm{pred}},\boldsymbol{M}^{\mathrm{dir}})'
    typst: '#eqs.scene.qh_scene_memory'
  scene.candidate_query_pools:
    tex: '\boldsymbol{g}_e^{\mathrm{tgt}},\boldsymbol{g}_{t,i}^{\mathrm{fr}},\boldsymbol{g}_{t,e,i}^{\cap}=\operatorname{Pool}(\boldsymbol{x}_j^{\mathrm{pt}})'
    typst: '#eqs.scene.candidate_query_pools'
  scene.candidate_ray_query:
    tex: '\boldsymbol{g}_{t,i}^{\mathrm{ray}}=\operatorname{RenderQuery}(\boldsymbol{M}_t^{\mathrm{ray}},q_{t,i},\hat{\boldsymbol{B}}_e)'
    typst: '#eqs.scene.candidate_ray_query'
  spatial.candidate_reference_transform:
    tex: '\boldsymbol{T}_{r_t,i}^{\mathrm{rel}}=\boldsymbol{T}_{w,r_t}^{-1}\boldsymbol{T}_{w,c_{t,i}},\quad \boldsymbol{\delta}_{r_t,i}^{p}=\boldsymbol{R}_{r_t}^{\top}(\boldsymbol{c}_{t,i}-\boldsymbol{c}_{r_t}),\quad \boldsymbol{R}_{r_t,i}=\boldsymbol{R}_{r_t}^{\top}\boldsymbol{R}_{t,i}'
    typst: '#eqs.spatial.candidate_reference_transform'
  spatial.candidate_pose_features:
    tex: '\boldsymbol{h}_{t,i}^{\mathrm{pose}}=\operatorname{concat}(\boldsymbol{\delta}_{r_t,i}^{p},\operatorname{R6D}(\boldsymbol{R}_{r_t,i}),\|\boldsymbol{\delta}_{r_t,i}^{p}\|_2,\operatorname{atan2}(\delta_{r_t,i}^{y},\delta_{r_t,i}^{x}),\Delta h_{t,i},\boldsymbol{u}_{t,i}^{\mathrm{up/frustum}})'
    typst: '#eqs.spatial.candidate_pose_features'
  spatial.candidate_target_relation:
    tex: '\boldsymbol{h}_{t,e\mid i}^{\mathrm{rel}}=\operatorname{concat}(\boldsymbol{\delta}_{e\mid i}^{p},\|\boldsymbol{\delta}_{e\mid i}^{p}\|_2,\cos\theta_{t,e,i}^{\mathrm{opt}},\beta_{t,e,i}^{\mathrm{elev}},\lambda_{t,e,i}^{\mathrm{obb}})'
    typst: '#eqs.spatial.candidate_target_relation'
  spatial.candidate_query_local_frame:
    tex: '\boldsymbol{\delta}_{a\mid i}^{p}=\boldsymbol{R}_{t,i}^{\top}(\boldsymbol{p}_a-\boldsymbol{c}_{t,i})'
    typst: '#eqs.spatial.candidate_query_local_frame'
  spatial.candidate_query_rpe:
    tex: '\boldsymbol{e}_{a\mid i}^{\mathrm{rel}}=\psi_{\mathrm{rel}}(\mathcal{F}(\boldsymbol{\eta}_{a\mid i}))'
    typst: '#eqs.spatial.candidate_query_rpe'
  spatial.direction_unit:
    tex: '\boldsymbol{d}_k(\boldsymbol{v})=(\boldsymbol{c}_k-\boldsymbol{v})/\|\boldsymbol{c}_k-\boldsymbol{v}\|_2'
    typst: '#eqs.spatial.direction_unit'
  spatial.direction_memory_sh:
    tex: '\boldsymbol{h}^{\mathrm{dir}}(\boldsymbol{v})=\sum_{k<t}w_k(\boldsymbol{v})\boldsymbol{Y}_L(\boldsymbol{d}_k(\boldsymbol{v}))'
    typst: '#eqs.spatial.direction_memory_sh'
  spatial.direction_memory_moment:
    tex: '\boldsymbol{M}^{\mathrm{dir}}(\boldsymbol{v})=\sum_{k<t}w_k(\boldsymbol{v})\boldsymbol{d}_k(\boldsymbol{v})\boldsymbol{d}_k(\boldsymbol{v})^\top'
    typst: '#eqs.spatial.direction_memory_moment'
  spatial.direction_novelty:
    tex: '\nu_{t,i}^{\mathrm{dir}}(\boldsymbol{v})=1-\frac{\boldsymbol{d}_{t,i}(\boldsymbol{v})^\top\boldsymbol{M}^{\mathrm{dir}}(\boldsymbol{v})\boldsymbol{d}_{t,i}(\boldsymbol{v})}{\operatorname{tr}(\boldsymbol{M}^{\mathrm{dir}}(\boldsymbol{v}))+\varepsilon}'
    typst: '#eqs.spatial.direction_novelty'
  model.qh_target_token:
    tex: '\boldsymbol{h}_e^{\mathrm{tgt}}=\operatorname{MLP}_{\mathrm{tgt}}(\operatorname{concat}(\boldsymbol{\phi}_e,\boldsymbol{g}_e^{\mathrm{tgt}}))'
    typst: '#eqs.model.qh_target_token'
  model.candidate_row_features:
    tex: '\boldsymbol{x}_{t,i}=\operatorname{concat}(\boldsymbol{h}_{t,i}^{\mathrm{pose+rel}},\boldsymbol{h}_{t,i}^{\mathrm{geom}},\boldsymbol{h}_{t,i}^{\mathrm{valid}},\boldsymbol{h}_{t,i}^{\mathrm{prov}},\boldsymbol{H}_t)'
    typst: '#eqs.model.candidate_row_features'
  rl.qh_residual_decomposition:
    tex: 'Q_{H,\theta,i}=b_{\psi,i}+\delta_{\theta,i}^{H}'
    typst: '#eqs.rl.qh_residual_decomposition'
  entity.objective:
    tex: '\mathrm{RRI}_{\mathrm{total}}(q)=\sum_{e\in\mathcal{E}}w_e\mathrm{RRI}_e+\lambda_{\mathrm{scene}}\mathrm{RRI}'
    typst: '#eqs.entity.objective'
  action.angle_cap_transform:
    tex: '\psi_{\mathrm{cap}}=\psi\Delta_\psi/(2\pi),\quad y_{\mathrm{cap}}=\sin\theta_{\min}+(u_y+1)(\sin\theta_{\max}-\sin\theta_{\min})/2'
    typst: '#eqs.action.angle_cap_transform'
  action.candidate_center_world:
    tex: 'r_i\sim\mathcal{U}(0.25,1.1),\quad \boldsymbol{c}_i^w=\boldsymbol{T}_r^w(r_i\boldsymbol{d}_i^{k(i)})'
    typst: '#eqs.action.candidate_center_world'
  action.capped_direction:
    tex: '\boldsymbol{d}_i^0=\operatorname{norm}(\sqrt{1-y_{\mathrm{cap}}^2}(\sin\psi_{\mathrm{cap}},\cos\psi_{\mathrm{cap}}),y_{\mathrm{cap}})'
    typst: '#eqs.action.capped_direction'
  action.family_directions:
    tex: '\boldsymbol{d}_i^{\mathrm{forward}},\boldsymbol{d}_i^{\mathrm{target}},\boldsymbol{d}_i^{\mathrm{bypass}}'
    typst: '#eqs.action.family_directions'
  action.motion_pruning_limits:
    tex: '\lVert\boldsymbol{o}_i\rVert_2\le1.0\,\mathrm{m},\ |\Delta h_i|\le0.25\,\mathrm{m},\ \Delta\psi_i\le70^\circ'
    typst: '#eqs.action.motion_pruning_limits'
  action.power_spherical_forward:
    tex: '\boldsymbol{u}_i\sim\mathrm{PS}(\boldsymbol{e}_z,\kappa),\quad p(\boldsymbol{u})=c_\kappa(1+\boldsymbol{e}_z^\top\boldsymbol{u})^\kappa'
    typst: '#eqs.action.power_spherical_forward'
  action.target_lookat_frame:
    tex: '\boldsymbol{z}_i^w=\operatorname{norm}(\boldsymbol{p}_e-\boldsymbol{c}_i^w),\quad\boldsymbol{x}_i^w=\boldsymbol{y}_i^w\times\boldsymbol{z}_i^w'
    typst: '#eqs.action.target_lookat_frame'
  action.valid_support_threshold:
    tex: 'N_{\mathrm{valid}}\ge\max(12,\lceil0.25N_q\rceil)'
    typst: '#eqs.action.valid_support_threshold'
  entity.endpoint_gain:
    tex: 'J_e^{(H)}=(\Delta_{t=0}^e-\Delta_{t=H}^e)/(\Delta_{t=0}^e+\varepsilon)'
    typst: '#eqs.entity.endpoint_gain'
  entity.log_gain:
    tex: 'J_{e,\mathrm{log}}^{(H)}=\log(\Delta_{t=0}^e+\varepsilon)-\log(\Delta_{t=H}^e+\varepsilon)'
    typst: '#eqs.entity.log_gain'
  entity.lookahead_headroom:
    tex: '\Delta_{\mathrm{look}}=J_e^{(H)}(\pi_{\mathrm{oracle-look}})-J_e^{(H)}(\pi_{\mathrm{oracle-1}})'
    typst: '#eqs.entity.lookahead_headroom'
  entity.q_recovery:
    tex: '\eta_Q=(J_e^{(H)}(\pi_Q)-J_e^{(H)}(\pi_{\mathrm{learned-1}}))/(J_e^{(H)}(\pi_{\mathrm{oracle-look}})-J_e^{(H)}(\pi_{\mathrm{learned-1}})+\varepsilon)'
    typst: '#eqs.entity.q_recovery'
  entity.target_error:
    tex: '\Delta_t^e=d(C_e(\mathcal{P}_t),\mathcal{M}_e^{\mathrm{GT}})'
    typst: '#eqs.entity.target_error'
  model.qh_input_contract:
    tex: '\mathcal{I}_{t,e}=(\boldsymbol{h}_e^{\mathrm{tgt}},\boldsymbol{\Phi}_t^{\mathrm{scene}},\boldsymbol{H}_t,\boldsymbol{b}_t,t,H,\{\boldsymbol{x}_{t,i},\boldsymbol{e}_{a\mid i}^{\mathrm{rel}},m_{t,i},\boldsymbol{\rho}_{t,i}\}_{i=1}^{N_q})'
    typst: '#eqs.model.qh_input_contract'
  model.qh_candidate_state_cross_attention:
    tex: '\boldsymbol{u}_{t,i}=\operatorname{CrossAttn}_{\theta}(\boldsymbol{x}_{t,i},\{\boldsymbol{h}_e^{\mathrm{tgt}},\boldsymbol{\Phi}_t^{\mathrm{scene}},\boldsymbol{H}_t,\operatorname{Emb}(t),\operatorname{Emb}(H),\boldsymbol{b}_t\})'
    typst: '#eqs.model.qh_candidate_state_cross_attention'
  rl.candidate_mask_isolation:
    tex: '\operatorname{Mask}(\boldsymbol{X}_t,\boldsymbol{m}_t)=\operatorname{Mask}(\widetilde{\boldsymbol{X}}_t,\boldsymbol{m}_t)'
    typst: '#eqs.rl.candidate_mask_isolation'
  rl.qh_candidate_token:
    tex: '\boldsymbol{u}_{t,i}=\operatorname{Enc}_\theta(\mathcal{I}_{t,e},q_{t,i})'
    typst: '#eqs.rl.qh_candidate_token'
  rl.qh_coral_interface:
    tex: '\begin{gathered}p_{t,i,k}^{\mathrm{CORAL}}=\sigma(o_{t,i,k}^{\mathrm{CORAL}}),\quad k=0,\ldots,K-2;\\ \pi_{t,i,k}^{\mathrm{CORAL}}=p_{t,i,k-1}^{\mathrm{CORAL}}-p_{t,i,k}^{\mathrm{CORAL}},\quad p_{t,i,-1}^{\mathrm{CORAL}}=1,\quad p_{t,i,K-1}^{\mathrm{CORAL}}=0;\\ \hat{r}_\psi^e(s_t^{\mathrm{cf0}},\boldsymbol{\phi}_e,q_{t,i})=\sum_{k=0}^{K-1}\pi_{t,i,k}^{\mathrm{CORAL}}u_k\end{gathered}'
    typst: '#eqs.rl.qh_coral_interface'
  rl.qh_masked_argmax:
    tex: 'a_t^\theta=\operatorname*{argmax}_{i:m_{t,i}=1}Q_{H,\theta,i}'
    typst: '#eqs.rl.qh_masked_argmax'
  rl.qh_doubleq_index:
    tex: 'B_t^{(h,e)}=Q_{h-1,\theta^-}(s_{t+1},\operatorname*{argmax}_{i:m_{t+1,i}=1}Q_{h-1,\theta}(s_{t+1},i))'
    typst: '#eqs.rl.qh_doubleq_index'
  rl.qh_doubleq_target:
    tex: 'y_t^{(h,e)}=r_t^e+\gamma B_t^{(h,e)}'
    typst: '#eqs.rl.qh_doubleq_target'
  rl.qh_uncentered_residual:
    tex: 'Q_{H,\theta,i}=b_{\psi,i}+\delta_{\theta,i}^H'
    typst: '#eqs.rl.qh_uncentered_residual'
  rl.replay_transition:
    tex: '(x_{t+1},\boldsymbol{H}_{t+1},b_{t+1},\mathcal{Q}_{t+1})=\operatorname{Step}(x_t,\boldsymbol{H}_t,b_t,q_{t,a_t},\xi_t)'
    typst: '#eqs.rl.replay_transition'
  scene.actor_state_read:
    tex: '\boldsymbol{h}_{t,e,i}=\operatorname{Read}(\boldsymbol{\Phi}_t^{\mathrm{scene}},\boldsymbol{h}_e^{\mathrm{tgt}},q_{t,i},\boldsymbol{H}_t,t,H)'
    typst: '#eqs.scene.actor_state_read'
