<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">ASE dataset and local mesh-evaluation snapshot scale</title>
  <desc id="desc">A logarithmic scene-count axis compares the 100,000 scenes in Aria Synthetic Environments with the 100-scene local ATEK EFM snapshot used for the mesh-evaluation protocol. The difference is three orders of magnitude, or one thousand to one.</desc>
  <rect width="1180" height="420" fill="#ffffff"/>
  <text x="70" y="52" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Released dataset scale and local mesh-evaluation scope</text>
  <text x="70" y="82" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="16">Scene count on a logarithmic scale</text>
  <line x1="178" y1="325" x2="1080" y2="325" stroke="#334155" stroke-width="2"/>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="178" y1="125" x2="178" y2="325"/>
    <line x1="358" y1="125" x2="358" y2="325"/>
    <line x1="538" y1="125" x2="538" y2="325"/>
    <line x1="718" y1="125" x2="718" y2="325"/>
    <line x1="898" y1="125" x2="898" y2="325"/>
    <line x1="1080" y1="125" x2="1080" y2="325"/>
  </g>
  <g fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <text x="178" y="355">1</text>
    <text x="358" y="355">10</text>
    <text x="538" y="355">100</text>
    <text x="718" y="355">1,000</text>
    <text x="898" y="355">10,000</text>
    <text x="1080" y="355">100,000</text>
  </g>
  <text x="629" y="395" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">number of ASE scenes</text>
  <text x="70" y="183" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Local mesh-evaluation snapshot</text>
  <text x="70" y="209" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15">100 scenes · 0.1% of ASE</text>
  <line x1="178" y1="199" x2="538" y2="199" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="538" cy="199" r="12" fill="#0f766e" stroke="#ffffff" stroke-width="4"/>
  <text x="558" y="204" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">100</text>
  <text x="70" y="274" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Aria Synthetic Environments</text>
  <text x="70" y="300" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15">released synthetic indoor scenes</text>
  <line x1="178" y1="290" x2="1080" y2="290" stroke="#315c8d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1080" cy="290" r="12" fill="#315c8d" stroke="#ffffff" stroke-width="4"/>
  <text x="1056" y="272" fill="#315c8d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">100,000</text>
  <path d="M 538 158 C 650 115, 966 115, 1080 158" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M 1071 151 L 1080 158 L 1068 160" fill="#b45309"/>
  <text x="809" y="125" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1,000:1 scene-count ratio</text>
</svg>
