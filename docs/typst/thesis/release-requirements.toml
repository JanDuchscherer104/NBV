# Maintained release requirements for the ARIA-NBV thesis.
#
# This ledger records release evidence and human handoffs. It is not a
# submission receipt and must not be used to infer an authenticated PRIMUSS
# state. The generated toolchain lock is intentionally pending in this slice;
# the lock-producing work replaces the placeholder before final verification.

schema_version = "aria-nbv-thesis-release-requirements-v1"
date_checked = "2026-08-23"

[toolchain_lock]
path = "docs/typst/thesis/toolchain-lock.json"
sha256 = "f7d5873501efa44609fa14f64a3aebce8426a93525e2a6f924d8d1e2056d05e6"
sha256_state = "verified"
required_state = "generated_lock_sha256_and_compiler_identity_verified"
current_state = "verified_against_test_only_implementation_commit"
blocker_rationale = "The generated lock matches the clean implementation commit, its material-input inventory, tracked IEEE CSL, and resolved Typst compiler identity."

[submission]
required_state = "human_and_confirmatory_evidence_required"
current_state = "blocked_missing_confirmatory_evidence"
assigned_spo_state = "manual_pending"
primuss_state = "manual_pending"
local_submission_claim = false
blocker_rationale = "Confirmatory held-out policy outcomes are absent: no validated population-level rollout bundle with paired endpoint estimates and uncertainty exists. The current report remains pilot/fixture evidence, so submission acceptance and PRIMUSS completion are not claimed locally."

[declaration]
source_path = "docs/typst/thesis/template/layout/disclaimer.typ"
presence = "present"
required_state = "present_with_approved_wording"
current_state = "present_manual_wording_approval_pending"
responsible_owner = "author and assigned supervisor"
proof_kind = "manual"
wording_approval = "manual_pending"
blocker_rationale = "The declaration is rendered and its wording is preserved, but repository evidence does not prove that the exact current wording has been approved by the assigned supervisor."

[ai_disclosure]
source_path = "docs/typst/thesis/main.typ"
presence = "present"
required_state = "present_or_explicit_not_applicable"
current_state = "present"
responsible_owner = "author and thesis release owner"
proof_kind = "deterministic"
blocker_rationale = "The main thesis contains the current AI-use disclosure; human review remains responsible for deciding whether its scope is complete."

