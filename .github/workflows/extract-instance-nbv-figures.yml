name: Extract Instance-NBV source figures

on:
  push:
    branches:
      - agent/instance-nbv-peer-review
    paths:
      - .github/workflows/extract-instance-nbv-figures.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/extract-instance-nbv-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/instance-nbv-peer-review
          fetch-depth: 0

      - name: Download arXiv TeX bundle and preserve original figures
        shell: bash
        run: |
          set -euo pipefail
          target="docs/figures/external/arXiv/Instance-NBV"
          legacy="docs/figures/external/arXiv-Instance-NBV"
          mkdir -p "$target"

          if [[ -f "$target/fig8_ver3.pdf" ]]; then
            echo "Source figures already present; removing only the legacy path."
            rm -rf "$legacy"
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          downloaded=false
          for url in \
            "https://arxiv.org/e-print/2602.08266" \
            "https://export.arxiv.org/e-print/2602.08266" \
            "https://arxiv.org/src/2602.08266"; do
            echo "Trying $url"
            if curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 300 \
              --user-agent "ARIA-NBV literature review (https://github.com/JanDuchscherer104/ARIA-NBV)" \
              "$url" --output "$tmp/source.tar"; then
              downloaded=true
              break
            fi
          done

          if [[ "$downloaded" != true ]]; then
            echo "Unable to download the arXiv source bundle." >&2
            exit 1
          fi

          mkdir -p "$tmp/source"
          tar -xf "$tmp/source.tar" -C "$tmp/source"

          expected=(
            fig1_ver5.pdf
            fig2_ver4.pdf
            fig3_ver4.pdf
            fig4_ver6.pdf
            fig5_ver2.pdf
            fig6_ver2.pdf
            fig7_ver4.pdf
            fig8_ver3.pdf
          )

          for name in "${expected[@]}"; do
            src="$(find "$tmp/source" -type f -path "*/figure/$name" -print -quit)"
            if [[ -z "$src" ]]; then
              echo "Missing expected source figure: $name" >&2
              find "$tmp/source" -maxdepth 3 -type f | sort >&2
              exit 1
            fi
            cp "$src" "$target/$name"
          done

          sudo apt-get update
          sudo apt-get install -y poppler-utils
          for pdf in "$target"/*.pdf; do
            stem="${pdf%.pdf}"
            pdftoppm -png -singlefile -r 180 "$pdf" "$stem"
          done

          (
            cd "$target"
            sha256sum ./*.pdf ./*.png | sort > SHA256SUMS.txt
          )
          rm -rf "$legacy"

      - name: Upload extracted source figures as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arXiv-Instance-NBV-figures
          path: docs/figures/external/arXiv/Instance-NBV
          if-no-files-found: error

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/figures/external/arXiv docs/figures/external/arXiv-Instance-NBV \
             && [[ -z "$(git ls-files --others --exclude-standard docs/figures/external/arXiv)" ]]; then
            echo "No figure changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A docs/figures/external/arXiv docs/figures/external/arXiv-Instance-NBV
          git commit -m "docs(figures): place Instance-NBV assets under arXiv"
          git push origin HEAD:agent/instance-nbv-peer-review

  diagnose-root-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/instance-nbv-peer-review
          fetch-depth: 1

      - name: Initialize EFM3D submodule
        run: git submodule update --init external/efm3d

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML uv

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Typst
        uses: typst-community/setup-typst@v5.1.0

      - name: Run root-contract targets independently
        shell: bash
        env:
          PYTHON_INTERPRETER: python
          CI_RENDER_DIR: ${{ runner.temp }}/aria-nbv-ci-renders
        run: |
          set +e
          set -o pipefail
          mkdir -p ci-diagnostics
          overall=0
          targets=(
            agents-db-validate
            qmd-frontmatter-check
            check-agent-memory
            package-smoke
            quarto-docs-ci
            typst-paper-ci
          )
          for target in "${targets[@]}"; do
            echo "===== $target =====" | tee "ci-diagnostics/$target.log"
            make "$target" 2>&1 | tee -a "ci-diagnostics/$target.log"
            status=${PIPESTATUS[0]}
            printf '%s\n' "$status" > "ci-diagnostics/$target.status"
            if [[ "$status" -ne 0 ]]; then
              overall=1
            fi
          done
          printf '%s\n' "$overall" > ci-diagnostics/overall.status
          exit 0

      - name: Upload root-contract diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: instance-nbv-root-contract-diagnostics
          path: ci-diagnostics
          if-no-files-found: error
