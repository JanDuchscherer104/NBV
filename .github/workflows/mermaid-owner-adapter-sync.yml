# Temporary, branch-scoped synchronization of the three generated adapters.
# Removed immediately after the generated-only commit has been verified.
name: Sync reviewed Mermaid notation adapters
on:
  push:
    branches: ['codex/mermaid-symbolic-workflow']
    paths: ['.github/workflows/mermaid-owner-adapter-sync.yml']
permissions:
  contents: read
jobs:
  sync-reviewed-adapters:
    if: github.repository == 'JanDuchscherer104/ARIA-NBV' && github.ref == 'refs/heads/codex/mermaid-symbolic-workflow' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.13.1'
      - name: Regenerate from the reviewed Typst owners
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/glossary_build.py validate render-notation-yaml render-notation-lua render-notation-typst
          python3 -W error -m unittest discover -s scripts/tests -p 'test_aria_mermaid_*.py'
      - name: Commit generated adapters only
        run: |
          set -eu
          git add -- docs/notation.yml docs/_extensions/aria-glossary/notation.generated.lua docs/typst/shared/notation.generated.typ
          python3 - <<'PY'
          import subprocess
          allowed = {'docs/notation.yml', 'docs/_extensions/aria-glossary/notation.generated.lua', 'docs/typst/shared/notation.generated.typ'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit(f'Unexpected staged paths: {changed - allowed}')
          PY
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(notation): regenerate adapters from reviewed Typst equation owners'
          # Ordinary fast-forward push: a concurrent branch change aborts safely.
          git push origin HEAD:refs/heads/codex/mermaid-symbolic-workflow
