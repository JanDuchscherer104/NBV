name: Validate Instance-NBV documentation

on:
  push:
    branches:
      - agent/instance-nbv-peer-review
    paths:
      - .github/workflows/validate-instance-nbv-docs.yml
      - docs/contents/literature/3dgs_instance_nbv.qmd
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-instance-nbv-docs.yml
      - docs/contents/literature/3dgs_instance_nbv.qmd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instance-nbv-peer-review
      - name: Reject control characters in the review source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/contents/literature/3dgs_instance_nbv.qmd")
          data = path.read_bytes()
          bad = []
          for offset, byte in enumerate(data):
              if byte < 32 and byte not in {10}:
                  lo = max(0, offset - 28)
                  hi = min(len(data), offset + 40)
                  bad.append((offset, byte, data[lo:hi]))
          if bad:
              for offset, byte, context in bad:
                  print(f"offset={offset} byte=0x{byte:02x} context={context!r}")
              raise SystemExit(f"found {len(bad)} control character(s)")
          print("review source contains no non-newline C0 control characters")
          PY

  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instance-nbv-peer-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML
      - name: Validate QMD frontmatter
        env:
          PYTHON_INTERPRETER: python
        run: make qmd-frontmatter-check

  quarto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instance-nbv-peer-review
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render Quarto documentation
        run: make quarto-docs-ci
