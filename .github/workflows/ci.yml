name: Root Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHON_INTERPRETER: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve OMX artifact history base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "${PR_BASE_SHA}" ]]; then
            previous_ref="$(git merge-base HEAD "${PR_BASE_SHA}")"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            previous_ref="${PUSH_BEFORE_SHA}"
          else
            previous_ref="$(git rev-parse HEAD^)"
          fi
          echo "OMX_ARTIFACT_PREVIOUS_REF=${previous_ref}" >> "${GITHUB_ENV}"

      - name: Initialize EFM3D submodule
        run: git submodule update --init external/efm3d

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip PyYAML uv
          GRAPHIFY_VERSION=$(tr -d '[:space:]' < .codex/skills/graphify/.graphify_version)
          python -m pip install "graphifyy==$GRAPHIFY_VERSION"
          INSTALLED_GRAPHIFY_VERSION=$(graphify --version | sed -E 's/.*([0-9]+[.][0-9]+[.][0-9]+).*/\1/')
          test "$INSTALLED_GRAPHIFY_VERSION" = "$GRAPHIFY_VERSION"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Typst
        uses: typst-community/setup-typst@v5.1.0

      - name: Run root CI contract
        env:
          CI_RENDER_DIR: ${{ runner.temp }}/aria-nbv-ci-renders
        run: make ci PYTEST_ARGS=

      - name: Run OMX artifact lifecycle tests
        run: python scripts/tests/test_validate_omx_artifacts.py

      - name: Run opt-in Graphify integration contract
        run: make graphify-ci
