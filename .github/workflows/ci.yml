name: Root Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      governance: ${{ steps.select.outputs.governance }}
      scientific: ${{ steps.select.outputs.scientific }}
      package: ${{ steps.select.outputs.package }}
      documentation: ${{ steps.select.outputs.documentation }}
      graphify: ${{ steps.select.outputs.graphify }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify CI impact policy
        run: make ci-impact-self-test PYTHON_INTERPRETER=python

      - name: Enforce Python documentation ratchet
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          make python-standards-ratchet PYTHON_INTERPRETER=python
          PYTHON_STANDARDS_BASE="$PR_BASE_SHA"

      - name: Validate commit-linked transcript provenance
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python scripts/codex_transcript_provenance.py validate-range "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA"

      - name: Select affected CI tiers
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --no-renames --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA" \
              | python scripts/ci_impact.py \
                  --labels-json "$PR_LABELS_JSON" \
                  --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci_impact.py --full --github-output "$GITHUB_OUTPUT"
          fi

  governance:
    needs: impact
    if: needs.impact.outputs.governance == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install governance dependencies
        run: python -m pip install --upgrade pip PyYAML
      - name: Validate governance contracts
        run: make ci-governance PYTHON_INTERPRETER=python

  scientific:
    needs: impact
    if: needs.impact.outputs.scientific == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize EFM3D submodule
        run: git submodule update --init external/efm3d
      - name: Install scientific validation dependencies
        run: python -m pip install --upgrade pip uv
      - name: Validate scientific contracts
        run: make ci-scientific PYTEST_ARGS=

  package:
    needs: impact
    if: needs.impact.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize EFM3D submodule
        run: git submodule update --init external/efm3d
      - name: Install package validation dependencies
        run: python -m pip install --upgrade pip uv
      - name: Validate package contracts
        run: make ci-package PYTEST_ARGS=

  documentation:
    needs: impact
    if: needs.impact.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip PyYAML pytest
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Set up Typst
        uses: typst-community/setup-typst@v5.1.0
      - name: Validate documentation
        env:
          CI_RENDER_DIR: ${{ runner.temp }}/aria-nbv-ci-renders
        run: make ci-documentation PYTHON_INTERPRETER=python

  graphify:
    needs: impact
    if: needs.impact.outputs.graphify == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Graphify dependencies
        run: |
          python -m pip install --upgrade pip PyYAML
          GRAPHIFY_VERSION=$(tr -d '[:space:]' < .codex/skills/graphify/.graphify_version)
          python -m pip install "graphifyy==$GRAPHIFY_VERSION"
          INSTALLED_GRAPHIFY_VERSION=$(graphify --version | sed -E 's/.*([0-9]+[.][0-9]+[.][0-9]+).*/\1/')
          test "$INSTALLED_GRAPHIFY_VERSION" = "$GRAPHIFY_VERSION"
      - name: Validate Graphify contracts
        run: make ci-graphify PYTHON_INTERPRETER=python

  ci:
    if: always()
    needs: [impact, governance, scientific, package, documentation, graphify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify selected jobs completed
        env:
          CI_IMPACT_RESULT: ${{ needs.impact.result }}
          CI_SELECTED_JSON: >-
            {"governance":"${{ needs.impact.outputs.governance }}",
             "scientific":"${{ needs.impact.outputs.scientific }}",
             "package":"${{ needs.impact.outputs.package }}",
             "documentation":"${{ needs.impact.outputs.documentation }}",
             "graphify":"${{ needs.impact.outputs.graphify }}"}
          CI_RESULTS_JSON: >-
            {"governance":"${{ needs.governance.result }}",
             "scientific":"${{ needs.scientific.result }}",
             "package":"${{ needs.package.result }}",
             "documentation":"${{ needs.documentation.result }}",
             "graphify":"${{ needs.graphify.result }}"}
        run: python scripts/ci_impact.py --check-aggregate
