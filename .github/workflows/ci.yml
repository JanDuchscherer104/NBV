name: Root Verification

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - ".configs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".graphifyignore"
      - ".omx/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "Makefile"
      - "README.md"
      - "SETUP.md"
      - "aria_nbv/**"
      - "docs/**"
      - "scripts/agents_db.py"
      - "scripts/check_graphify_freshness.py"
      - "scripts/check_graphify_history.py"
      - "scripts/check_graphify_integration.py"
      - "scripts/git_hooks/**"
      - "scripts/graphify_*.py"
      - "scripts/scaffold/**"
      - "scripts/templates/lrz/**"
      - "scripts/tests/**"
      - "scripts/validate_agent_memory.py"
      - "scripts/validate_scaffold_wp0_baseline.py"
      - "scripts/validate_qmd_frontmatter.py"
  push:
    branches:
      - main
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - ".configs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".graphifyignore"
      - ".omx/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "Makefile"
      - "README.md"
      - "SETUP.md"
      - "aria_nbv/**"
      - "docs/**"
      - "scripts/agents_db.py"
      - "scripts/check_graphify_freshness.py"
      - "scripts/check_graphify_history.py"
      - "scripts/check_graphify_integration.py"
      - "scripts/git_hooks/**"
      - "scripts/graphify_*.py"
      - "scripts/scaffold/**"
      - "scripts/templates/lrz/**"
      - "scripts/tests/**"
      - "scripts/validate_agent_memory.py"
      - "scripts/validate_scaffold_wp0_baseline.py"
      - "scripts/validate_qmd_frontmatter.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHON_INTERPRETER: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize EFM3D submodule
        run: git submodule update --init external/efm3d

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip PyYAML uv
          GRAPHIFY_VERSION=$(tr -d '[:space:]' < .codex/skills/graphify/.graphify_version)
          python -m pip install "graphifyy==$GRAPHIFY_VERSION"
          INSTALLED_GRAPHIFY_VERSION=$(graphify --version | sed -E 's/.*([0-9]+[.][0-9]+[.][0-9]+).*/\1/')
          test "$INSTALLED_GRAPHIFY_VERSION" = "$GRAPHIFY_VERSION"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Typst
        uses: typst-community/setup-typst@v5.1.0

      - name: Run root CI contract
        env:
          CI_RENDER_DIR: ${{ runner.temp }}/aria-nbv-ci-renders
        run: make ci PYTEST_ARGS=
