name: Root Verification

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".agents/**"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - ".configs/**"
      - ".graphifyignore"
      - ".omx/plans/*ownership-branch-consolidation.md"
      - ".omx/specs/ownership-branch-consolidation-*"
      - "AGENTS.md"
      - "Makefile"
      - "README.md"
      - "SETUP.md"
      - "aria_nbv/**"
      - "docs/**"
      - "scripts/agents_db.py"
      - "scripts/scaffold_audit.py"
      - "scripts/scaffold/fixtures/routing.json"
      - "scripts/build_graphify_projection.py"
      - "scripts/ci_impact.py"
      - "scripts/check_graphify_freshness.py"
      - "scripts/graphify_worktree_seed.py"
      - "scripts/setup_worktree_env.sh"
      - "scripts/templates/lrz/**"
      - "scripts/tests/test_build_graphify_projection.py"
      - "scripts/tests/test_ci_impact.py"
      - "scripts/tests/test_typst_authoring_hygiene.py"
      - "scripts/tests/test_agent_governance_g002.py"
      - "scripts/tests/test_graphify_freshness.py"
      - "scripts/tests/test_graphify_upstream_skill.py"
      - "scripts/tests/test_graphify_worktree_seed.py"
      - "scripts/tests/test_ownership_consolidation_contract.py"
      - "scripts/tests/test_setup_worktree_env.sh"
      - "scripts/tests/test_validate_agent_memory_retired.py"
      - "scripts/validate_agent_memory.py"
      - "scripts/validate_qmd_frontmatter.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHON_INTERPRETER: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select affected CI families
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --no-renames --name-only -z "$PR_BASE_SHA" "$PR_HEAD_SHA" \
              | python scripts/ci_impact.py --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci_impact.py --full --github-output "$GITHUB_OUTPUT"
          fi

      - name: Verify CI impact routing
        run: make ci-impact-self-test PYTHON_INTERPRETER=python

      - name: Initialize EFM3D submodule
        if: steps.impact.outputs.package == 'true'
        run: git submodule update --init external/efm3d

      - name: Install shared validation dependencies
        if: >-
          steps.impact.outputs.scaffold == 'true' ||
          steps.impact.outputs.docs == 'true'
        run: python -m pip install --upgrade pip pytest PyYAML "graphifyy==0.9.31"

      - name: Set up uv
        if: steps.impact.outputs.package == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          prune-cache: false
          cache-suffix: uv-0.12.5
          cache-dependency-glob: |
            aria_nbv/pyproject.toml
            aria_nbv/uv.lock

      - name: Sync package validation environment
        if: steps.impact.outputs.package == 'true'
        working-directory: aria_nbv
        run: uv sync --locked --extra dev

      - name: Set up Quarto
        if: steps.impact.outputs.docs == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Typst
        if: steps.impact.outputs.docs == 'true'
        env:
          TYPST_VERSION: 0.14.2
          TYPST_EXPECTED_VERSION: typst 0.14.2 (b33de9de)
          TYPST_URL: https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
          TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/typst-${TYPST_VERSION}.tar.xz"
          install_root="${RUNNER_TEMP}/typst"
          mkdir -p "${install_root}"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --output "${archive}" "${TYPST_URL}"
          printf '%s  %s\n' "${TYPST_SHA256}" "${archive}" \
            | sha256sum --check --strict
          tar -xJf "${archive}" --strip-components=1 -C "${install_root}"
          echo "${install_root}" >> "${GITHUB_PATH}"
          PATH="${install_root}:${PATH}"
          test "$(typst --version)" = "${TYPST_EXPECTED_VERSION}"

      - name: Validate agent scaffold and memory
        if: steps.impact.outputs.scaffold == 'true'
        run: |
          make agents-db-validate check-agent-memory scaffold-audit scaffold-audit-self-test
          python3 scripts/tests/test_agent_governance_g002.py
          python3 scripts/tests/test_graphify_worktree_seed.py
          bash scripts/tests/test_setup_worktree_env.sh
          python3 scripts/tests/test_graphify_freshness.py
          python3 scripts/tests/test_graphify_upstream_skill.py

      - name: Validate ownership consolidation
        if: >-
          steps.impact.outputs.scaffold == 'true' ||
          steps.impact.outputs.docs == 'true'
        run: make ownership-consolidation-contract PYTHON_INTERPRETER=python

      - name: Validate package contracts
        if: steps.impact.outputs.package == 'true'
        env:
          UV_NO_SYNC: "1"
          PYTEST_WORKERS: "0"
        run: make ruff-full package-smoke

      - name: Validate documentation
        if: steps.impact.outputs.docs == 'true'
        env:
          CI_RENDER_DIR: ${{ runner.temp }}/aria-nbv-ci-renders
        run: make qmd-frontmatter-check api-docs-self-test docs-render-core
