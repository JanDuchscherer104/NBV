name: Symbolic Mermaid figures
on:
  pull_request:
    paths:
      - '.agents/skills/aria-nbv-mermaid/**'
      - 'tools/mermaid/**'
      - 'docs/typst/shared/symbols.typ'
      - 'docs/typst/shared/symbols/**'
      - 'docs/typst/shared/equations.typ'
      - 'docs/typst/shared/equations/**'
      - 'docs/notation.yml'
      - 'docs/_extensions/aria-glossary/notation.generated.lua'
      - 'docs/typst/shared/notation.generated.typ'
      - 'scripts/tests/test_aria_mermaid_*.py'
      - '.github/workflows/mermaid-symbolic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.13.1'
      - name: Regenerate notation from its Typst owners
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/glossary_build.py validate render-notation-yaml render-notation-lua render-notation-typst
          git diff --exit-code -- docs/notation.yml docs/_extensions/aria-glossary/notation.generated.lua docs/typst/shared/notation.generated.typ
      - name: Unit tests
        run: |
          python3 -W error -m unittest discover -s scripts/tests -p 'test_aria_mermaid_*.py'
      - name: Compile owner references and check generated Mermaid
        run: |
          mkdir -p .cache/mermaid
          for source in tools/mermaid/templates/flowchart_symbolic.mmd tools/mermaid/examples/pr190/*.mmd; do
            name="$(basename "$source" .mmd)"
            python3 tools/mermaid/scripts/aria_mermaid_owners.py "$source" --output ".cache/mermaid/$name.mmd" --receipt ".cache/mermaid/$name.refs.json"
            python3 tools/mermaid/scripts/aria_mermaid_lint.py ".cache/mermaid/$name.mmd"
          done
      - name: Install renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-cmu fonts-lmodern ripgrep
          bash tools/mermaid/scripts/test_render_mermaid.sh
          fc-match 'CMU Serif'
          fc-match 'CMU Serif:style=Bold'
          npm install --prefix tools/mermaid --no-save --package-lock=false @mermaid-js/mermaid-cli@11.17.0 puppeteer@25.9.0
          npm list --prefix tools/mermaid --all > .cache/mermaid/versions.txt || true
          printf '{"args":["--no-sandbox"]}\n' > .cache/mermaid/puppeteer.json
      - name: Render and inspect at declared physical size
        run: |
          status=0
          for source in tools/mermaid/templates/flowchart_symbolic.mmd tools/mermaid/examples/pr190/*.mmd; do
            name="$(basename "$source" .mmd)"
            tools/mermaid/scripts/render_mermaid.sh "$source" ".cache/mermaid/$name.svg" --puppeteer-config .cache/mermaid/puppeteer.json || { status=1; continue; }
            width="$(sed -n 's/^[[:space:]]*%% aria-width-mm: *//p' "$source")"
            node tools/mermaid/scripts/inspect_mermaid.mjs ".cache/mermaid/$name.svg" "${width:-160}" ".cache/mermaid/$name" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-mermaid-review
          path: |
            .cache/mermaid/*.mmd
            .cache/mermaid/*.refs.json
            .cache/mermaid/*.svg
            .cache/mermaid/*.png
            .cache/mermaid/*.qa.json
            .cache/mermaid/versions.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-mermaid-source-proof
          include-hidden-files: true
          path: |
            tools/mermaid/scripts/
            tools/mermaid/examples/
            tools/mermaid/templates/
            tools/mermaid/references/
            docs/typst/shared/
            docs/notation.yml
            docs/_extensions/aria-glossary/notation.generated.lua
            scripts/glossary_build.py
            scripts/tests/test_aria_mermaid_*.py
            !**/__pycache__/**
          if-no-files-found: error
