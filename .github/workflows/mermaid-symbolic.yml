name: Symbolic Mermaid figures
on:
  pull_request:
    paths:
      - '.agents/skills/aria-nbv-mermaid/**'
      - 'tools/mermaid/**'
      - 'scripts/tests/test_aria_mermaid_notation.py'
      - '.github/workflows/mermaid-symbolic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          python3 -W error -m unittest discover -s scripts/tests -p test_aria_mermaid_notation.py
      - name: Check canonical notation and computational coverage
        env:
          PR190_REF: b420d20cc01aa76451d002811f850bc87869b525
        run: |
          mkdir -p .cache/mermaid
          git fetch --depth=1 origin "$PR190_REF"
          git show "$PR190_REF:docs/notation.yml" > .cache/mermaid/pr190-notation.yml
          python3 tools/mermaid/scripts/aria_mermaid_notation.py --require-strict --require-architecture tools/mermaid/templates/flowchart_symbolic.mmd
          python3 tools/mermaid/scripts/aria_mermaid_notation.py --require-strict --require-architecture --notation .cache/mermaid/pr190-notation.yml tools/mermaid/examples/pr190/*.mmd
          python3 tools/mermaid/scripts/aria_mermaid_lint.py tools/mermaid/templates/flowchart_symbolic.mmd tools/mermaid/examples/pr190/*.mmd
      - name: Install renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-cmu fonts-lmodern ripgrep
          bash tools/mermaid/scripts/test_render_mermaid.sh
          fc-match 'CMU Serif'
          fc-match 'CMU Serif:style=Bold'
          npm install --prefix tools/mermaid --no-save --package-lock=false @mermaid-js/mermaid-cli@11.17.0 puppeteer@25.9.0
          npm list --prefix tools/mermaid --all > .cache/mermaid/versions.txt || true
          printf '{"args":["--no-sandbox"]}\n' > .cache/mermaid/puppeteer.json
      - name: Render and inspect at declared physical size
        run: |
          status=0
          for source in tools/mermaid/templates/flowchart_symbolic.mmd tools/mermaid/examples/pr190/*.mmd; do
            name="$(basename "$source" .mmd)"
            tools/mermaid/scripts/render_mermaid.sh "$source" ".cache/mermaid/$name.svg" --puppeteer-config .cache/mermaid/puppeteer.json || { status=1; continue; }
            width="$(sed -n 's/^[[:space:]]*%% aria-width-mm: *//p' "$source")"
            node tools/mermaid/scripts/inspect_mermaid.mjs ".cache/mermaid/$name.svg" "${width:-160}" ".cache/mermaid/$name" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-mermaid-review
          path: |
            .cache/mermaid/*.svg
            .cache/mermaid/*.png
            .cache/mermaid/*.qa.json
            .cache/mermaid/versions.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-mermaid-source-proof
          include-hidden-files: true
          path: |
            tools/mermaid/scripts/
            tools/mermaid/examples/
            tools/mermaid/templates/
            tools/mermaid/references/
            docs/typst/shared/
            docs/notation.yml
            scripts/glossary_build.py
            scripts/tests/test_aria_mermaid_notation.py
            .cache/mermaid/pr190-notation.yml
          if-no-files-found: error
